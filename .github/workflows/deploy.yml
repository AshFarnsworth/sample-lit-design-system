name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # The site is served from https://<user>.github.io/<repo>/, so every asset
      # URL needs that prefix. Storybook lives one level deeper.
      - name: Build Pokédex
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Build Storybook
        run: npm run build:storybook
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/design-system/

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r apps/pokedex/dist/. site/
          mkdir -p site/design-system
          cp -r packages/design-system/storybook-static/. site/design-system/

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
